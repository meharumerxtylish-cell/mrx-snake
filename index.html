<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MR X Snake Pro</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0f; color:#f5c542; font-family:'Segoe UI',Arial,sans-serif; text-align:center; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:30px; letter-spacing:2px; margin:6px 0 2px; text-shadow:0 0 18px rgba(245,197,66,.5); }
  .sub { color:#9a9ab0; font-size:13px; margin-bottom:12px; }
  .bar { display:flex; gap:22px; font-size:17px; margin-bottom:10px; }
  .bar b { color:#fff; }
  canvas { background:#12121c; border:2px solid #f5c542; border-radius:12px; box-shadow:0 0 30px rgba(245,197,66,.25); max-width:92vw; height:auto; touch-action:none; }
  .row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  button { background:#f5c542; color:#111; border:none; padding:10px 20px; font-size:15px; font-weight:700; border-radius:9px; cursor:pointer; }
  button.ghost { background:#1d1d2b; color:#f5c542; border:1px solid #f5c542; }
  .pad { display:grid; grid-template-columns:56px 56px 56px; gap:6px; margin-top:14px; }
  .pad button { padding:12px 0; font-size:19px; }
  .pad .blank { visibility:hidden; }
  #msg { margin-top:10px; font-size:16px; min-height:22px; color:#fff; }
  footer { margin-top:16px; color:#66667d; font-size:12px; }
</style>
</head>
<body>
  <h1>🐍 MR X SNAKE PRO</h1>
  <div class="sub">Eat the gold. Dodge the walls. Beat your own record.</div>
  <div class="bar">
    <div>Score: <b id="score">0</b></div>
    <div>Best: <b id="best">0</b></div>
    <div>Speed: <b id="speed">1</b></div>
  </div>
  <canvas id="game" width="420" height="420"></canvas>
  <div id="msg">Press START or hit Space</div>
  <div class="row">
    <button id="startBtn">▶ START</button>
    <button id="pauseBtn" class="ghost">⏸ Pause</button>
  </div>
  <div class="pad">
    <span class="blank"></span><button data-dir="up">⬆</button><span class="blank"></span>
    <button data-dir="left">⬅</button><button data-dir="down">⬇</button><button data-dir="right">➡</button>
  </div>
  <footer>MR X Games • Play Beyond Limits</footer>
<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const N = 21, CELL = cv.width / N;
let snake, dir, nextDir, food, score, best = +(localStorage.getItem('mrx_snake_best') || 0), timer = null, speedMs, level;
document.getElementById('best').textContent = best;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir; score = 0; level = 1; speedMs = 150;
  placeFood(); draw(); updateHud();
  document.getElementById('msg').textContent = 'Good luck, champion!';
}
function placeFood() {
  do { food = {x:(Math.random()*N)|0, y:(Math.random()*N)|0}; }
  while (snake.some(s => s.x===food.x && s.y===food.y));
}
function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  document.getElementById('speed').textContent = level;
}
function step() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(s => s.x===head.x && s.y===head.y)) {
    gameOver(); return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10; placeFood();
    if (score % 50 === 0 && speedMs > 70) { speedMs -= 12; level++; restartTimer(); }
  } else snake.pop();
  updateHud(); draw();
}
function draw() {
  ctx.fillStyle = '#12121c'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle = 'rgba(255,255,255,.04)';
  for (let i=1;i<N;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,cv.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(cv.width,i*CELL); ctx.stroke(); }
  ctx.fillStyle = '#f5c542';
  ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2-2, 0, 7); ctx.fill();
  snake.forEach((s,i) => {
    ctx.fillStyle = i===0 ? '#ffe27a' : (i%2 ? '#37d67a' : '#2bb765');
    ctx.fillRect(s.x*CELL+1.5, s.y*CELL+1.5, CELL-3, CELL-3);
  });
}
function restartTimer(){ clearInterval(timer); timer = setInterval(step, speedMs); }
function start(){ if (timer) return; if (!snake) reset(); restartTimer(); document.getElementById('msg').textContent=''; }
function pause(){ if (timer){ clearInterval(timer); timer=null; document.getElementById('msg').textContent='Paused'; } }
function gameOver(){
  pause(); best = Math.max(best, score); localStorage.setItem('mrx_snake_best', best); updateHud();
  document.getElementById('msg').textContent = '💥 Game Over! Score: ' + score + ' — press START to retry';
  snake = null;
}
function setDir(x,y){ if (!snake) return; if (dir.x === -x && dir.y === -y) return; nextDir = {x,y}; }
document.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); timer ? pause() : start(); }
  if (e.key === 'ArrowUp') setDir(0,-1); if (e.key === 'ArrowDown') setDir(0,1);
  if (e.key === 'ArrowLeft') setDir(-1,0); if (e.key === 'ArrowRight') setDir(1,0);
});
document.querySelectorAll('.pad button').forEach(b => b.addEventListener('click', () => {
  const d = b.dataset.dir; start();
  if (d==='up') setDir(0,-1); if (d==='down') setDir(0,1); if (d==='left') setDir(-1,0); if (d==='right') setDir(1,0);
}));
let tx, ty;
cv.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
cv.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0); else setDir(0, dy > 0 ? 1 : -1);
}, {passive:true});
document.getElementById('startBtn').addEventListener('click', () => { if (!snake) reset(); start(); });
document.getElementById('pauseBtn').addEventListener('click', pause);
reset();
</script>
</body>
</html>
